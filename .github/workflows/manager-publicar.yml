name: MAS3D Manager · publicar

# Compila la imagen en GitHub (no en el VPS, para no consumir su memoria),
# la guarda en el registro privado de GitHub (ghcr.io) y pide a Coolify que la despliegue.
# Se ejecuta al subir cambios a la rama "produccion" o manualmente desde la pestaña Actions.

on:
  workflow_dispatch:
  push:
    branches: [produccion]
    paths: ['manager/**']

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-manager
  cancel-in-progress: false

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuración
        run: |
          for v in "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" "${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" "${{ vars.NEXT_PUBLIC_SITE_URL }}"; do
            [ -n "$v" ] || { echo "::error::Faltan variables del repositorio (Settings → Secrets and variables → Actions → Variables)"; exit 1; }
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen
        id: img
        run: echo "nombre=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mas3d-manager" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: manager
          push: true
          tags: |
            ${{ steps.img.outputs.nombre }}:latest
            ${{ steps.img.outputs.nombre }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Desplegar en Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Coolify aún no está conectado: la imagen quedó publicada, despliega manualmente desde Coolify."; exit 0
          fi
          curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false"
      - name: Borrar imágenes antiguas (conserva las 5 más recientes)
        uses: actions/delete-package-versions@v5
        with:
          package-name: mas3d-manager
          package-type: container
          min-versions-to-keep: 5
        continue-on-error: true
