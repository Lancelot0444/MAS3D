name: MAS3D Manager · pruebas

on:
  push:
    paths: ['manager/**', '.github/workflows/manager-ci.yml']
  pull_request:
    paths: ['manager/**', '.github/workflows/manager-ci.yml']

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-prueba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manager/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Pruebas (cálculos y base de datos)
        run: npx vitest run
      - name: Compilación
        run: npx next build
